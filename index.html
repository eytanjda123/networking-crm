<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Network">
  <title>Networking</title>
  <script>try { if (localStorage.getItem('crm_unlocked') === '1') document.documentElement.dataset.unlocked = '1'; } catch (e) {}</script>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>

<div id="gate">
  <form id="gate-form" class="gate-card" autocomplete="off">
    <div class="gate-icon" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    </div>
    <h1>Networking</h1>
    <p class="gate-sub">Enter the passcode to continue.</p>
    <input id="gate-input" type="password" placeholder="Passcode" aria-label="Passcode" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="btn btn-primary btn-block" type="submit">Unlock</button>
    <p id="gate-error" class="gate-error" role="alert" hidden>That passcode isn't right.</p>
  </form>
</div>

<div id="app">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1>Networking</h1>
        <span id="count-label" class="count" aria-live="polite"></span>
      </div>
      <div class="topbar-actions">
        <button id="export-btn" class="btn" title="Download the contacts shown as an Excel file">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
          <span>Export</span>
        </button>
        <button id="lock-btn" class="btn btn-icon" title="Lock" aria-label="Lock">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="controls">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search-input" type="search" placeholder="Search name, firm, role, notes…" aria-label="Search contacts" autocomplete="off">
      </div>
      <div class="seg" role="group" aria-label="Time range">
        <button type="button" data-range="all" aria-pressed="true">All</button>
        <button type="button" data-range="7" aria-pressed="false">Past 7 days</button>
        <button type="button" data-range="30" aria-pressed="false">Past 30 days</button>
      </div>
    </section>

    <section class="filters" aria-label="Filters">
      <label class="field" id="event-field" hidden>
        <span>Event</span>
        <select id="event-filter"><option value="">All</option></select>
      </label>
      <label class="field">
        <span>Group by</span>
        <select id="group-by">
          <option value="">None</option>
          <option value="firm">Firm</option>
          <option value="event">Event</option>
        </select>
      </label>
      <label class="field">
        <span>Sort</span>
        <select id="sort-by">
          <option value="recent">Last contact</option>
          <option value="met">Date met</option>
          <option value="name">Name</option>
          <option value="firm">Firm</option>
          <option value="role">Role</option>
          <option value="office">Office</option>
          <option value="event">Event</option>
          <option value="yale">Yale class</option>
        </select>
        <button type="button" id="sort-dir" class="dir-btn" aria-label="Reverse sort order">↓</button>
      </label>
      <label class="field">
        <span>Notes</span>
        <select id="notes-mode">
          <option value="short">Short</option>
          <option value="medium">Medium</option>
          <option value="full">Full</option>
        </select>
      </label>
      <label class="chip-toggle">
        <input type="checkbox" id="som-filter">
        <span>Yale</span>
      </label>
    </section>

    <div id="results" aria-busy="true">
      <div class="table-wrap">
        <table id="contacts-table">
          <thead>
            <tr>
              <th class="c-name" scope="col" data-sort-col="name"><button type="button" class="th-sort" data-sort="name">Name<span class="arrow" aria-hidden="true"></span></button></th>
              <th class="c-firm" scope="col" data-sort-col="firm"><button type="button" class="th-sort" data-sort="firm">Firm<span class="arrow" aria-hidden="true"></span></button></th>
              <th class="c-role" scope="col" data-sort-col="role"><button type="button" class="th-sort" data-sort="role">Role<span class="arrow" aria-hidden="true"></span></button></th>
              <th class="c-when" scope="col" data-sort-col="recent"><button type="button" class="th-sort" data-sort="recent">Last contact<span class="arrow" aria-hidden="true"></span></button></th>
              <th class="c-note" scope="col">Notes</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
      <div id="card-list"></div>
      <div id="empty" class="empty">Loading contacts…</div>
    </div>

    <footer class="page-note">Read-only. To add or change a contact, ask Claude to update the data.</footer>
  </main>
</div>

<div id="backdrop"></div>
<aside id="detail" aria-hidden="true" aria-label="Contact details">
  <div class="detail-bar">
    <button id="detail-close" class="btn btn-icon" aria-label="Close details">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div id="detail-body" class="detail-body"></div>
</aside>

<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
